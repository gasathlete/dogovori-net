<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Договори.нет — визуален бранд наръчник</title><style>:root{--gold:#B69A58;--navy:#101827;--ivory:#FAF8F3}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--navy);font:16px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:48px 24px}h1,h2{letter-spacing:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.panel{padding:32px;border:1px solid #ded9ce;background:white}.dark{background:var(--navy);color:var(--ivory)}img{display:block;max-width:100%;height:auto}.swatches{display:flex;flex-wrap:wrap;gap:16px}.swatch{min-width:180px;padding:24px;border:1px solid #ded9ce}.gold{background:var(--gold)}.navy{background:var(--navy);color:var(--ivory)}.ivory{background:var(--ivory)}.sizes{display:flex;align-items:end;gap:28px}.clear{padding:7%;border:1px dashed var(--gold)}code{font-size:14px}</style></head><body><main><h1>Договори.нет — визуален бранд наръчник</h1><p>Одобрен кирилски монограм „ДН“, септември 2026 г.</p><h2>Основни версии</h2><div class="grid"><section class="panel"><img src="logo-light.svg" alt="Лого за светъл фон"></section><section class="panel dark"><img src="logo-dark.svg" alt="Лого за тъмен фон"></section></div><h2>Палитра</h2><div class="swatches"><div class="swatch gold"><b>Gold</b><br><code>#B69A58</code></div><div class="swatch navy"><b>Navy</b><br><code>#101827</code></div><div class="swatch ivory"><b>Ivory</b><br><code>#FAF8F3</code></div></div><h2>Свободно поле</h2><div class="panel"><div class="clear"><img src="mark-gold.svg" width="260" height="219" alt="Знак със свободно поле"></div><p>Пазете свободно поле поне 1/4 от височината на знака.</p></div><h2>Малки размери</h2><div class="panel sizes"><img src="mark-mini.svg" width="16" height="14" alt="Знак 16 пиксела"><img src="mark-mini.svg" width="32" height="27" alt="Знак 32 пиксела"><img src="mark-gold.svg" width="64" height="54" alt="Знак 64 пиксела"></div><h2>Самостоятелни знаци</h2><div class="grid"><section class="panel"><img src="mark-gold.svg" alt="Златен знак"></section><section class="panel"><img src="mark-navy.svg" alt="Navy знак"></section><section class="panel dark"><img src="mark-white.svg" alt="Ivory знак"></section></div></main></body></html>
