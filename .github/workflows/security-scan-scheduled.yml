name: Security scan (scheduled full repo)

# Weekly full-repo scan catches issues outside the PR diff baseline
# (e.g. legacy migrations, files touched only by other branches, drift).
# Results are uploaded to GitHub Code Scanning so history is preserved.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read  # required by codeql-action/upload-sarif for workflow metadata
  contents: read
  security-events: write

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks below is explicitly a full-history scan.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run full-repo security-scan
        run: |
          mkdir -p reports
          bun run scripts/security-scan.ts \
            --github \
            --sarif=reports/security-scan.sarif \
            --no-exit-code

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/security-scan.sarif') != ''
        continue-on-error: true  # Artifact upload below remains authoritative when Code Scanning is unavailable.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/security-scan.sarif
          category: lovable-security-scan-full

      - name: Upload SARIF artifact
        if: always() && hashFiles('reports/security-scan.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-sarif
          path: reports/security-scan.sarif
          retention-days: 90

      # Run gitleaks across the full history too.
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
