name: Gate 5 source bundle

on:
  push:
    branches:
      - codex/gate5-source-bundle-20260921

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 1a0e83f0a946dad3261eb3311a07ac6ef83f94e9
          fetch-depth: 1

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "1a0e83f0a946dad3261eb3311a07ac6ef83f94e9"

      - name: Create sanitized exact-source archive
        shell: bash
        run: |
          git archive --format=zip --output=dogovori-net-gate5-source-1a0e83f.zip HEAD
          zip -d dogovori-net-gate5-source-1a0e83f.zip .env

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dogovori-net-gate5-source-1a0e83f
          path: dogovori-net-gate5-source-1a0e83f.zip
          if-no-files-found: error
          retention-days: 1
