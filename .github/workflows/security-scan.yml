name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read  # required by codeql-action/upload-sarif for workflow metadata
  contents: read
  security-events: write  # required to upload SARIF to Code Scanning
  pull-requests: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for `git diff` against base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Built-in modules only: scan independently of application installation.

      # Custom static scan — only on files changed in this PR/push.
      # Existing findings are grandfathered; CI blocks NEW SECURITY DEFINER
      # without authz, missing RLS, permissive policies, leaked secrets.
      - name: Determine changed files
        id: changed
        run: |
          mkdir -p reports
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          git diff --name-only -z --diff-filter=AM "$base" "$head" -- \
            'supabase/migrations/*.sql' 'drizzle/migrations/*.sql' 'docs/migrations/*.sql' \
            'src/**/*' 'supabase/functions/**/*' 'scripts/**/*' \
            > reports/security-changed-files.bin
          if [ -s reports/security-changed-files.bin ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run security-scan (changed files, with GitHub annotations + SARIF)
        if: steps.changed.outputs.has_files == 'true'
        run: |
          mapfile -d '' -t changed_files < reports/security-changed-files.bin
          bun run scripts/security-scan.ts \
            --github \
            --sarif=reports/security-scan.sarif \
            "${changed_files[@]}"

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/security-scan.sarif') != ''
        continue-on-error: true  # Code Scanning is optional; the scanner itself remains blocking.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/security-scan.sarif
          category: lovable-security-scan-pr

      - name: Upload SARIF artifact
        if: always() && hashFiles('reports/security-scan.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-sarif
          path: reports/security-scan.sarif
          retention-days: 30

      # Secondary: gitleaks for broader secret scanning.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
