name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required to upload SARIF to Code Scanning
  pull-requests: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for `git diff` against base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # Custom static scan — only on files changed in this PR/push.
      # Existing findings are grandfathered; CI blocks NEW SECURITY DEFINER
      # without authz, missing RLS, permissive policies, leaked secrets.
      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          files=$(git diff --name-only --diff-filter=AM "$base" "$head" -- \
            'supabase/migrations/*.sql' 'src/**/*' 'supabase/functions/**/*' 'scripts/**/*' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run security-scan (changed files, with GitHub annotations + SARIF)
        if: steps.changed.outputs.files != ''
        run: |
          mkdir -p reports
          bun run scripts/security-scan.ts \
            --github \
            --sarif=reports/security-scan.sarif \
            ${{ steps.changed.outputs.files }}

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/security-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/security-scan.sarif
          category: lovable-security-scan-pr

      # Secondary: gitleaks for broader secret scanning.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
