name: SEO monitor

on:
  schedule:
    # Daily at 05:00 UTC (08:00 EEST)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to monitor"
        required: false
        default: "https://dogovori.net"

permissions:
  contents: read
  issues: write # used by failure step to open a tracking issue

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install tsx runner
        run: bun add -d tsx

      - name: Run SEO monitor
        id: seo
        env:
          SEO_BASE_URL: ${{ github.event.inputs.base_url || 'https://dogovori.net' }}
          SEO_WEBHOOK_URL: ${{ secrets.SEO_ALERT_WEBHOOK }}
          SEO_SAMPLE_SIZE: "20"
        run: bunx tsx scripts/seo-monitor.ts

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-monitor-report
          path: reports/seo-monitor.json
          retention-days: 60

      - name: Open / update tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '⚠ SEO monitor detected regressions on the latest scheduled run.\n\n';
            try {
              const r = JSON.parse(fs.readFileSync('reports/seo-monitor.json', 'utf8'));
              body += `Base: \`${r.base}\`\nChecked: ${r.checked}\nErrors: ${r.errors}\nWarnings: ${r.warnings}\n\n`;
              body += '| Level | URL | Rule | Message |\n|---|---|---|---|\n';
              for (const i of r.issues.slice(0, 50)) {
                body += `| ${i.level} | ${i.url} | ${i.rule} | ${i.message} |\n`;
              }
            } catch (e) {
              body += `(could not read report: ${e.message})`;
            }
            const title = `SEO regression — ${new Date().toISOString().slice(0,10)}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'seo-regression', state: 'open', per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['seo-regression'],
              });
            }
