    <script>
      // No-flash theme: apply stored theme before React renders.
      // If user has no stored preference, follow the OS / browser color scheme.
      (function () {
        try {
          var t = localStorage.getItem("dogovori:theme");
          var c;
          if (t === "light" || t === "dark") {
            c = t;
          } else {
            c = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
          }
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(c);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <script>
      // LCP: the home hero poster is preloaded only on "/" so other routes don't pay for it.
      if (location.pathname === "/") {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.setAttribute("fetchpriority", "high");
        l.setAttribute("imagesrcset", "/hero/hero-poster-960.webp 960w, /hero/hero-poster-1280.webp 1280w");
        l.setAttribute("imagesizes", "100vw"); l.href = "/hero/hero-poster-1280.webp";
        document.head.appendChild(l);
      }
    </script>
